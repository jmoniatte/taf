# ~/.config/taf/config.yml (optional)

# Color theme: terminal (read from the terminal itself) or any base16 scheme
# in tui-kit (tui_kit/styles/themes/), by its upstream slug. Press t in the app to
# browse them; the choice is written back here.
theme: terminal

database_path: '~/.config/taf/taf.sqlite3'

# What the Stats tab shows: hours, or percentages only, to share it; set from the tab
stats_show: hours

action:
  default: 'code'
  rules:
    meet:
      - '^Met\b'
    email:
      - '\bEmailed\b'
    admin:
      - null
context:
  default: 'frontend'
  rules:
    backend:
      - '\brails\b'
      - '\bdjango\b'
    mobile:
      - '\bandroid\b'
      - '\bios\b'

# Watch: what needs you, collected from Slack and GitHub (taf watch collect, on a timer)
watch:
  model: sonnet                  # the Claude model that reads Slack
  max_budget_usd: 1.0            # per collector run
  slack:
    skip_channels: []            # bot feeds: reading them costs money and finds nothing
    max_pages: 10                # 20 messages a page; the rest waits for the next run
    first_run_hours: 24
  github:
    review_teams: []             # review requests to these teams count as yours ("org/team")
    ignore_users: []             # comments from these accounts never need a reply
